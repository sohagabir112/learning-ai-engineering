[project]
name = "hiremeai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SohagAbir", email = "sohagabir112@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.2",
    "groq>=1.7.0",
    "pydantic>=2.14.3",
