[project]
name = "aiproctor"
version = "0.1.0"
description = "AI Proctor — Code plagiarism detection (MOSS) and AI-generated code detection"
readme = "README.md"
authors = [
    { name = "SohagAbir", email = "sohagabir112@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "streamlit>=1.30",
    "scikit-learn>=1.3",
]

[project.scripts]
aiproctor = "aiproctor:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
